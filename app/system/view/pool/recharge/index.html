<div class="layui-fluid">
    <div class="layui-card">
        <div class="layui-card-header">
            <form class="layui-form render">
                <div class="layui-form-item">
                    <div class="layui-inline" style="width:200px;"><input type="text" name="kw" placeholder="订单号/交易号" autocomplete="off" class="layui-input" lay-affix="clear"/></div>
                    <div class="layui-inline" style="width:100px;"><input type="number" name="userid" placeholder="用户ID" autocomplete="off" class="layui-input" lay-affix="clear"/></div>
                    <div class="layui-inline" style="width:90px;">
                        <select name="status">
                            <option value="">状态</option>
                            <option value="0">待支付</option>
                            <option value="1">已支付</option>
                            <option value="2">已失效</option>
                        </select>
                    </div>
                    <div class="layui-inline">
                        <div class="layui-btn-group">
                            <button class="layui-btn" lay-submit lay-filter="search-recharge"><i class="layui-icon layui-icon-search"></i> 搜索</button>
                            <a class="layui-btn" lay-submit lay-filter="search-recharge-all"><i class="layui-icon layui-icon-light"></i>全部</a>
                            <a class="layui-btn layui-btn-warm" id="recharge-points"><i class="layui-icon layui-icon-edit"></i> 积分调整</a>
                        </div>
                    </div>
                </div>
            </form>
        </div>
        <div class="layui-card-body">
            <table lay-filter="recharge" id="recharge"></table>
        </div>
    </div>
</div>
<!--JS部分-->
<script type="text/javascript">
layui.use(['buildItems'], function(){
    var map_root = layui.cache.maps;
    var app_root = map_root + 'pool.recharge/';
    var layer = layui.layer,table=layui.table,form=layui.form,admin=layui.admin;
    var limit = {$limit};
    var Status = {$status|raw};
    /*渲染数据*/
    table.render({
        elem: '#recharge',
        size: 'sm',
        page: true,
        limit: limit,
        height: 'full-195',
        url: app_root+"index?do=json",
        cellExpandedMode:'tips',
        cols: [[
            {field:'rid',width:60,unresize:true,align:'center',title:'ID',sort:!0},
            {field:"orderid",minWidth:170,title:"订单号"},
            {field:"userid",width:70,align:'center',title:"用户ID"},
            {field:"money",width:80,align:'center',title:"金额(元)",sort:!0},
            {field:"points",width:90,align:'center',title:"获得积分",templet:function(d){return '<span style="color:#16B777">'+d.points+'</span>'}},
            {field:"paytype",width:90,align:'center',title:"支付方式",templet:function(d){return d.paytype||'-'}},
            {field:"trade_no",minWidth:150,title:"第三方交易号",templet:function(d){return d.trade_no||'-'}},
            {field:"status",width:90,align:'center',title:"状态",templet:function(d){return d.status==1 ? '<span style="color:#16B777">已支付</span>' : (d.status==0 ? '<span style="color:#FFB800">待支付</span>' : '<span style="color:#999">已失效</span>')}},
            {field:"add_time",width:160,align:'center',title:"创建时间",templet:function(d){return d.add_time ? layui.util.toDateString(d.add_time*1000,'yyyy-MM-dd HH:mm:ss') : '-'}},
            {fixed:'right',width:130,align:'center',toolbar:'<div><a class="layui-btn layui-btn-xs layui-btn-warm" lay-event="mark">补单</a><a class="layui-btn layui-btn-xs layui-btn-danger" lay-event="del">删除</a></div>',title:'操作'}
        ]]
    });
    /*搜索按钮(自动reload约定：lay-filter="search-recharge"/"search-recharge-all")*/
    /*工具条监听*/
    table.on('tool(recharge)', function(obj){
        if(obj.event === 'mark'){
            var isPaid = obj.data.status == 1;
            if(isPaid) return layer.msg('该订单已是已支付状态');
            layer.confirm('确认手动标记该订单为【已支付】并补加 '+obj.data.points+' 积分给用户ID['+obj.data.userid+']吗？',function(){
                admin.req(app_root+"mark",{rid:obj.data.rid,av:1},function(res){
                    layer.msg(res.msg,{shade:[0.4,'#000'],time:1500},function(){
                        if(res.code==1) table.reloadData('recharge');
                    });
                },'post',{headersToken:true});
            });
        }else if(obj.event === 'del'){
            layer.confirm('确定要删除该订单记录吗？',function(){
                admin.req(app_root+"del",{rid:obj.data.rid},function(res){
                    layer.msg(res.msg,{shade:[0.4,'#000'],time:1500},function(){
                        if(res.code==1) table.reloadData('recharge');
                    });
                },'post',{headersToken:true});
            });
        }
    });/**/
    /*积分调整*/
    $('#recharge-points').on('click', function(){
        admin.open({
            type: 1,
            bid: 'points_items',
            btn: ['确认调整', '取消'],
            area: ['460px','340px'],
            title: '用户积分调整',
            success: function(lay,index){
                layui.buildItems.build({
                    bid: 'points_items',
                    data: [
                        {name:"userid",title:"用户ID",type:"number",value:'',verify:'required',placeholder:"请输入用户 userid",must:true},
                        {name:"points",title:"调整积分",type:"text",value:'',verify:'required',placeholder:"正数增加，负数扣减，如：100 或 -50",must:true,tips:"扣减时若余额不足将失败"},
                        {name:"remark",title:"备注说明",type:"textarea",value:'',placeholder:"选填"}
                    ]
                });
                form.on('submit(points_items)',function(data){
                    var btn = $(this);
                    if (btn.attr('stop')){return false}else{btn.attr('stop',1)}
                    admin.req(app_root+"points",data.field,function(res){
                        layer.msg(res.msg,{shade:[0.4,'#000'],time:1500},function(){
                            if(res.code==1) layer.close(index);
                            btn.removeAttr('stop');
                        });
                    },'post',{headersToken:true});
                    return false;
                });
            }
        });
    });/**/
});
</script>
